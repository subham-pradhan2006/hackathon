<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310"><rect width="860" height="310" rx="24" fill="#f1f5f8"/><text x="30" y="46" fill="#172c3b" font-family="Arial" font-size="22" font-weight="700">Synthetic sensor thresholds</text><text x="30" y="72" fill="#627586" font-family="Arial" font-size="14">Manual inputs; NOT physical sensor measurements</text><g font-family="Arial"><rect x="30" y="104" width="384" height="160" rx="17" fill="white" stroke="#d5e0e9"/><text x="53" y="144" font-size="17" font-weight="700" fill="#172c3b">Smoke concentration</text><text x="53" y="178" font-size="32" font-weight="700" fill="#d26c29">300 ppm</text><rect x="53" y="201" width="326" height="12" rx="6" fill="#e7edf1"/><rect x="53" y="201" width="163" height="12" rx="6" fill="#e78b52"/><circle cx="216" cy="207" r="12" fill="#cc682c" stroke="white" stroke-width="4"/><text x="53" y="241" font-size="12" fill="#5c7180">TEST SMOKE if value is at least 300 ppm</text><rect x="445" y="104" width="384" height="160" rx="17" fill="white" stroke="#d5e0e9"/><text x="468" y="144" font-size="17" font-weight="700" fill="#172c3b">Temperature</text><text x="468" y="178" font-size="32" font-weight="700" fill="#d26c29">70°C</text><rect x="468" y="201" width="326" height="12" rx="6" fill="#e7edf1"/><rect x="468" y="201" width="198" height="12" rx="6" fill="#e78b52"/><circle cx="666" cy="207" r="12" fill="#cc682c" stroke="white" stroke-width="4"/><text x="468" y="241" font-size="12" fill="#5c7180">TEST HIGH_TEMPERATURE at 70°C or more</text></g></svg>