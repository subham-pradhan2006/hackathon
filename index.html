", "verify": "Explain that a transient tracking ID is not proof of employee identity.", "viva": "Is tracking facial recognition? → No, not by itself."}, {"title": "Users and responsibilities", "summary": "Admin configures the system; Operator monitors and acknowledges; Safety Officer manages policies and safety workflows; Supervisor handles assigned investigations within authorized views.", "action": "Sign in with permitted demonstration accounts and compare accessible pages.", "verify": "Check backend permissions as well as hidden menu items.", "viva": "Why RBAC? → It limits sensitive actions and reduces unauthorized changes."}, {"title": "Detection versus incident", "summary": "A YOLO prediction has a class and confidence; an incident is a separate recorded workflow event when eligibility rules are met.", "action": "Trace sample input → filtered detection → rule evaluation → incident → acknowledgement.", "verify": "Never describe every bounding box as an incident.", "viva": "Is a detection proof of a violation? → No; rules and human verification matter."}, {"title": "Alert and response lifecycle", "summary": "A qualifying event can be recorded, surfaced to operators, acknowledged, assigned, investigated and resolved with audit history.", "action": "Walk through a test or permitted recorded event and identify decision points.", "verify": "Show source, severity, time, status and evidence where present.", "viva": "Why record acknowledgement? → To show somebody received responsibility for a report."}, {"title": "Live, uploaded and synthetic sources", "summary": "LIVE_CAMERA observations, UPLOADED_SAMPLE image results and SIMULATION_SENSOR TEST incidents must be interpreted separately.", "action": "Compare the source label in each workflow.", "verify": "Uploaded image/video results are not automatically saved as live incidents.", "viva": "Can test data be called real factory evidence? → No."}, {"title": "Prototype limitations", "summary": "The available project context describes a 26-check catalog with limited approved model coverage; field performance and certified use are not established.", "action": "Explain supported checks versus placeholders or unregistered candidate models.", "verify": "Do not claim 26 trained detectors or industrial certification.", "viva": "What is the limitation? → Coverage and real-world validation remain incomplete."}, {"title": "One-minute project viva", "summary": "Present problem, architecture, monitoring, incident workflow, analytics and lab testing in a coherent sequence.", "action": "Give a 60-second walkthrough: inputs, AI checks, event handling, human decision and reporting.", "verify": "State which readings and images are synthetic or demonstration-only.", "viva": "What is SafetyGuard AI? → A factory hazard-monitoring and response prototype."}]}, {"id": "cameras", "icon": "camera", "title": "Camera Network & Live Monitoring", "kicker": "LIVE OPERATIONS", "description": "Configure webcams/IP cameras, select safety policies and understand what the live annotated preview actually means.", "fact": "Webcam indices 0–16 and HTTP/HTTPS/RTSP sources were described in the operational workflow.", "lessons": [{"title": "Camera Network page", "summary": "The network registers devices and associates a source with a factory or zone. Multiple cameras can have independent checklists.", "action": "Open Camera Network, choose a camera and review its name, type, source and zone.", "verify": "Show which policy belongs to that exact camera.", "viva": "Do all cameras share one policy? → No, policies are per camera."}, {"title": "Webcam index selection", "summary": "A locally connected webcam is opened by a numeric index; documented indices span 0 through 16. Index 0 is often built-in, but device assignment varies.", "action": "Test the candidate index while no conflicting application is holding the device.", "verify": "Show a legitimate frame before treating a camera as connected.", "viva": "Is webcam 0 always external? → No."}, {"title": "IP camera address", "summary": "An external network camera can use a supported HTTP, HTTPS or RTSP URL, subject to codecs, credentials, connectivity and authorization.", "action": "Enter the full authorized stream URL without exposing passwords in a demo.", "verify": "Test that the stream decodes; network reachability alone is insufficient.", "viva": "Why can RTSP fail? → URL, network, permissions or decoder issues."}, {"title": "Camera-to-zone assignment", "summary": "The selected physical zone supplies operational context for incidents and restricted-area rules.", "action": "Select the camera's monitored zone and save its configuration.", "verify": "Review the incident location to confirm the intended zone.", "viva": "Why store a camera zone? → To route and understand alerts."}, {"title": "Per-camera safety checks", "summary": "A policy selects only the checks relevant to the location; a detector must be loaded and mapped to the requested class.", "action": "Enable one supported check, save, and use the same camera in Live Monitoring.", "verify": "Confirm unselected classes are not promoted into chosen-check violations.", "viva": "Does selecting a check guarantee inference? → No, compatible model support is needed."}, {"title": "Start and stop streams", "summary": "Starting opens capture and monitoring; stopping should release that stream and end its active processing.", "action": "Start one authorized source, show live frames, stop it and observe the state change.", "verify": "Check camera status before drawing conclusions about missed events.", "viva": "Why stop explicitly? → To release device and compute resources."}, {"title": "Preview and inference pipeline", "summary": "Capture retrieves frames, OpenCV decodes, supported YOLO models infer classes, rules filter observations, and the UI renders annotations.", "action": "Point out source feed, detection overlay, label and confidence.", "verify": "Preview performance may favor recent frames instead of displaying stale ones.", "viva": "Is every displayed frame analyzed identically? → Not necessarily under load."}, {"title": "Tracking worker observations", "summary": "Temporary person tracks help relate adjacent frames and can support zone entry logic; occlusion and camera transitions break continuity.", "action": "Show one moving person if permitted and explain the displayed track marker.", "verify": "Never infer legal identity from temporary IDs.", "viva": "Can one ID work across all cameras? → Not guaranteed."}, {"title": "When a live incident is saved", "summary": "A detector prediction becomes a candidate only if the selected check, event rules and relevant timing conditions agree.", "action": "Demonstrate an authorized qualifying event or explain recorded evidence.", "verify": "Confirm the incident source is associated with the active camera, not an upload.", "viva": "Does one image create a live event? → Only the live-event rules decide."}, {"title": "Camera viva demonstration", "summary": "Combine source setup, policy selection, monitoring and alert trace in one short sequence.", "action": "Open Camera Network → enable supported check → start stream → inspect overlay → stop.", "verify": "If no camera is available, use the Test Lab without claiming live-camera validation.", "viva": "What's the difference between camera and video lab? → Live stream versus uploaded recording."}]}, {"id": "models", "icon": "scan", "title": "AI Safety Checks & Model Intelligence", "kicker": "AI EXPLAINED", "description": "Separate requested safety rules from genuinely compatible model classes, predictions and verified hazards.", "fact": "The safety-check catalog includes 26 options; prior operational notes indicated model support for only a subset.", "lessons": [{"title": "Check catalog versus detector", "summary": "A UI check names a desired risk, while a model checkpoint supplies actual classes. The presence of a catalog option does not prove detector availability.", "action": "Compare the selected check with model-registry status.", "verify": "Treat unsupported checks as unsupported rather than inventing boxes.", "viva": "Are all 26 checks trained? → No, the catalog is broader than confirmed model coverage."}, {"title": "YOLO inference concept", "summary": "YOLO predicts object bounding boxes, class labels and confidence scores for supported classes.", "action": "Show the input frame, prediction rectangles and filtered output.", "verify": "A score is model confidence, not calibrated probability of a true safety event.", "viva": "What is YOLO used for? → Visual object detection."}, {"title": "Positive PPE versus violations", "summary": "Detecting a helmet or vest is not equivalent to proving PPE compliance for every worker. Missing-equipment rules need appropriate negative classes or robust association logic.", "action": "Compare a positive Helmet label with a supported No Helmet violation label.", "verify": "Absence of detection alone must not establish a violation.", "viva": "If no helmet box appears, is the worker non-compliant? → Not necessarily."}, {"title": "Per-camera class filtering", "summary": "The pipeline should surface only classes mapped to active checks on the selected camera.", "action": "Enable a helmet-only check and compare it with a broader model's class output.", "verify": "Extra model classes must not silently become unauthorized violations.", "viva": "Why filter? → To reduce irrelevant alerts and preserve policy semantics."}, {"title": "Fire and smoke signals", "summary": "Fire/flame and smoke are different checks requiring compatible predictions or sensor rules; neither a colored pixel nor a generic person class is enough.", "action": "Explain the class mapping using example safety footage.", "verify": "Distinguish visual smoke detection from manually entered simulated readings.", "viva": "Is simulation a smoke detector? → No."}, {"title": "Confidence and thresholds", "summary": "The confidence value helps interpret model predictions; thresholds trade false positives against missed detections.", "action": "Use a hypothetical score of 0.82 only as an example, never as actual output.", "verify": "Report a model's displayed score only after real inference.", "viva": "Does high confidence equal certainty? → No."}, {"title": "Worker tracking concepts", "summary": "A short-lived tracker can associate a person box across frames and support temporal rules. It is not an identity registry.", "action": "Explain how successive person boxes relate to the same moving subject.", "verify": "Tracks can reset after occlusion or camera restart.", "viva": "Is frame count a unique-worker count? → No."}, {"title": "Temporal rules and cooldowns", "summary": "Some incidents require persistence across frames and a cooldown to prevent repeated alarms. Restricted-area rules have explicit three-frame and 25-second parameters in this prototype.", "action": "Show the state sequence observe → qualify → cooldown.", "verify": "Do not imply all checks use identical timing rules.", "viva": "Why cooldown? → To reduce duplicate event storms."}, {"title": "False positives and review", "summary": "Reflections, lighting, occlusions and weak model coverage can create or hide observations. Human review labels and notes support investigation.", "action": "Show a false-positive workflow through Incident Management.", "verify": "Record why an alert was dismissed instead of deleting its history.", "viva": "Why keep false positives? → They inform system evaluation."}, {"title": "Candidate model boundaries", "summary": "Face shield/apron candidate classes exist in experimental checkpoints but are not automatically registered as approved live detectors.", "action": "Explain the separate local inference evaluation and normal registry.", "verify": "Avoid claiming experimental Face Shield and Apron classes are production-ready.", "viva": "Can an unregistered candidate appear in Live Monitoring? → Not automatically."}]}, {"id": "incidents", "icon": "alert", "title": "Incident Management & Supervisor Workflow", "kicker": "RESPONSE CENTER", "description": "Understand incident creation, evidence, acknowledgement, assignment, false positives, escalation and closure.", "fact": "Incidents carry source, type, severity, time, status and relevant evidence or event history.", "lessons": [{"title": "Incident record anatomy", "summary": "An incident is the durable object representing a candidate safety event and its handling lifecycle.", "action": "Open an incident record and identify ID, type, source, severity, camera/zone and timestamps.", "verify": "Verify the visible record is not just a transient bounding box.", "viva": "Which fields make an alert actionable? → What, where, when and current status."}, {"title": "Creation and evidence", "summary": "Eligible live rules can save incidents and evidence; simulated sensor rules save clearly marked TEST incidents. Uploaded-image and video lab inference does not save live incidents.", "action": "Compare a live sample record with a SIMULATION_SENSOR record.", "verify": "Verify every sample is correctly labeled.", "viva": "Does Image Lab add incident evidence? → Not automatically."}, {"title": "Alert presentation", "summary": "Dashboard notices, browser/audio prompts and configured email channels may surface a recorded event, but they are distinct mechanisms.", "action": "Show an active alert indicator and, where permitted, corresponding notification settings.", "verify": "A recorded incident does not guarantee every delivery channel succeeded.", "viva": "What if email fails? → The incident record remains separate from delivery."}, {"title": "Acknowledgement", "summary": "An authorized operator or safety responder acknowledges awareness of a reported incident. Acknowledgement is not the same as fixing the hazard.", "action": "Open a pending incident and use the permitted acknowledge action.", "verify": "Observe user and timestamp in status/history where surfaced.", "viva": "Is acknowledgement resolution? → No."}, {"title": "Supervisor assignment", "summary": "Assigned supervisors can investigate events in their authorized scope, rather than gaining unrestricted access to all configuration.", "action": "Assign or inspect an assigned supervisor from the permitted administrative view.", "verify": "Verify role permissions in the interface and backend.", "viva": "Why assign an owner? → To make follow-up responsibility explicit."}, {"title": "False-positive decisions", "summary": "A model can misclassify scenes; an authorized reviewer can mark a report false positive and preserve an audit trail.", "action": "Use a documented example and explain the reason for dismissal.", "verify": "Keep original source and decision history for later quality analysis.", "viva": "Why not simply delete it? → Auditability and model improvement."}, {"title": "Escalation and timeouts", "summary": "An overdue serious report can qualify for escalation based on enabled rules. The documented default is HIGH+ after 120 seconds.", "action": "Show settings and explain what happens when an incident remains unacknowledged.", "verify": "Treat delivery as separately observable from eligibility.", "viva": "What causes escalation? → Configured severity and delay with no timely acknowledgement."}, {"title": "Investigation notes", "summary": "Evidence, findings, probable cause and corrective actions can be recorded as investigation notes by authorized people.", "action": "Demonstrate a concise note such as 'reviewed PPE footage; retraining recommended'.", "verify": "Distinguish factual observation from unverified conclusion.", "viva": "Why store notes? → To document reasoning and actions."}, {"title": "Resolution and closure", "summary": "Resolution records the authorized decision that work on an incident is complete. Its audit trail can show prior acknowledgement, assignment and review.", "action": "Open a handled incident and explain its status chronology.", "verify": "Never equate closing the ticket with certified removal of physical risk.", "viva": "What does resolved mean? → Workflow completion, subject to real-world verification."}, {"title": "Incident viva walkthrough", "summary": "Trace one sample case from detection to response and audit, optionally using a TEST synthetic incident if no camera is available.", "action": "Create a legitimate demo event → locate incident → acknowledge → assign/review → add notes → resolve.", "verify": "State explicitly whether each step is live, sample, or simulated.", "viva": "What makes it end-to-end? → Event, response, accountability and evidence."}]}, {"id": "analytics", "icon": "chart", "title": "Analytics, Reports & Safety Intelligence", "kicker": "MEASURE & REVIEW", "description": "Interpret incident trends, severity, locations, false positives and response times without overstating the data.", "fact": "Analytics describe stored records. They cannot validate a model or the factory safety state by themselves.", "lessons": [{"title": "Dashboard KPIs", "summary": "Overview cards summarize stored incidents, unresolved workload, severity and recent activity according to current filters.", "action": "Open Analytics and compare a displayed metric with filtered incident records.", "verify": "Check that TEST data and date range are understood.", "viva": "Can a high incident count mean improved detection? → Possibly; context matters."}, {"title": "Time-series trends", "summary": "Time-bucketed incident charts help reveal when recorded hazard observations increased or decreased.", "action": "Select a date window and compare daily or weekly bins where available.", "verify": "Interpret trends as counts of records, not independently verified factory accident rates.", "viva": "What is the x-axis? → Time interval."}, {"title": "Severity breakdown", "summary": "A severity chart groups incidents by severity class.", "action": "Inspect counts for high, medium, low and TEST where applicable.", "verify": "Do not merge TEST events with confirmed industrial severity without disclosure.", "viva": "Why severity? → To prioritize response."}, {"title": "Camera-level activity", "summary": "Per-camera counts can reveal noisy scenes or repeatedly triggered policies.", "action": "Choose a camera and identify its reported events for a timeframe.", "verify": "Normalize by monitoring duration before comparing camera risk.", "viva": "Can camera A's higher count prove it is less safe? → No."}, {"title": "Zone and hazard analysis", "summary": "Location and incident-type breakdowns help identify where and what is frequently reported.", "action": "Filter by zone, hazard type and incident source.", "verify": "Verify missing or unmapped zones are not mistaken for safe locations.", "viva": "What is a hotspot? → An area with relatively concentrated recorded events."}, {"title": "False-positive rate", "summary": "A useful review metric is dismissed false-positive reports divided by evaluated incidents, with denominator clearly defined.", "action": "Explain the calculation using a hypothetical 4 false positives among 20 reviewed incidents = 20%.", "verify": "Do not report a denominator as total frames or all unreviewed events.", "viva": "Does 20% measure model precision? → Not directly."}, {"title": "Response-time metrics", "summary": "Response duration is commonly measured from incident creation to acknowledgement; reporting rules must handle unacknowledged records.", "action": "Compute an illustrative 10:00 → 10:03 acknowledgement as 3 minutes.", "verify": "Clarify whether average includes only acknowledged incidents.", "viva": "What does MTT A mean? → Mean time to acknowledgement."}, {"title": "Source segmentation", "summary": "LIVE_CAMERA records, synthetic TEST sensor records and image/video lab results belong to different evidentiary categories.", "action": "Filter or explain groups by source and severity.", "verify": "Uploaded media analysis does not create ordinary incident rows.", "viva": "Why separate simulated events? → To prevent distorted operational conclusions."}, {"title": "CSV and evidence review", "summary": "A report export helps review records in Excel and attach supporting analysis to a hackathon presentation.", "action": "Export where available and inspect IDs, times, types, statuses and filters.", "verify": "Remove workplace personal data before public sharing.", "viva": "Are charts a replacement for row-level audit? → No."}, {"title": "Analytics viva walkthrough", "summary": "Show overview, date trend, severity, camera activity, false-positive review, response time and source separation.", "action": "Explain one chart with a real record from the demo database.", "verify": "Do not invent numbers: show the current system output or label examples hypothetical.", "viva": "What's the most important caveat? → Metrics reflect collected and classified data."}]}, {"id": "settings", "icon": "settings", "title": "Settings, Zones & Escalation Rules", "kicker": "CONFIGURATION", "description": "Configure restricted-area geometry, rule eligibility, alerts, diagnostics and permissions.", "fact": "Restricted-area logic uses normalized polygons, person-box foot points and temporal safeguards.", "lessons": [{"title": "Roles and setting scope", "summary": "System-wide configuration changes require elevated access; operators generally observe and respond rather than rewiring safety policies.", "action": "Compare authorized Admin/Safety Officer controls with Operator and Supervisor views.", "verify": "Hidden buttons do not replace backend authorization.", "viva": "Who should change policy? → An explicitly authorized configuration role."}, {"title": "Draw a restricted polygon", "summary": "A selected camera can have a restricted-area polygon made of 3–12 normalized points.", "action": "Use a frame preview to place a closed boundary around the prohibited zone.", "verify": "Avoid self-intersecting or tiny polygons and save with the correct camera.", "viva": "Why minimum three points? → A planar polygon needs at least three vertices."}, {"title": "Normalized coordinates", "summary": "Coordinates are stored proportionally to image dimensions, allowing geometry to scale as the preview resolution changes.", "action": "Explain x = pixel_x/frame_width and y = pixel_y/frame_height.", "verify": "Ensure all saved coordinates map to the intended part of the camera view.", "viva": "Why normalize? → To avoid resolution-specific geometry."}, {"title": "Person foot-point test", "summary": "For restricted-zone entry, the system evaluates the bottom-center of a detected person box rather than simply testing any box overlap.", "action": "Draw the person box and mark its lower-center point in the diagram.", "verify": "A partial body overlap should not be described as a confirmed entry by itself.", "viva": "Why bottom-center? → It approximates ground contact."}, {"title": "Restricted event timing", "summary": "The documented geofence rule requires three consecutive qualifying frames and a 25-second cooldown before a repeated incident.", "action": "Explain the sequence: track enters → persists → event → cooldown.", "verify": "Point out that these exact settings apply to this rule, not every hazard.", "viva": "Why 3 frames? → To reduce one-frame noise."}, {"title": "Camera-specific enablement", "summary": "A polygon alone is not sufficient if the relevant RESTRICTED_ZONE check is not enabled for that camera.", "action": "Enable the matching check, assign the polygon and test with authorized material.", "verify": "Verify the geometry and selected policy correspond to the same source.", "viva": "Why must both be enabled? → Detection requires policy plus zone configuration."}, {"title": "Escalation defaults", "summary": "Operational context describes escalation as enabled, eligible at HIGH and above after 120 seconds, subject to installed configuration.", "action": "Show severity selector, timeout and escalation enable flag.", "verify": "Describe it as a configurable workflow rule, not guaranteed external delivery.", "viva": "Does every LOW alert escalate? → Not under the stated default."}, {"title": "Notification channels", "summary": "In-app dashboard, audio, browser and email channels have different dependencies and delivery semantics.", "action": "Check each enabled channel and demonstrate the locally supported one.", "verify": "Do not claim an email was received unless delivery is verified.", "viva": "Why separate channels? → One may fail while records still exist."}, {"title": "System diagnostics and retention", "summary": "Diagnostics help distinguish camera connectivity, model loading, queue health, logs and stored media retention.", "action": "Check model registry, camera status, backend health and retained output.", "verify": "Remove test media according to the site's retention policy; do not expose raw worker footage.", "viva": "What do diagnostics prove? → System status, not detector accuracy."}, {"title": "Settings viva walkthrough", "summary": "Create and review one camera-restricted polygon and explain alert escalation, then restore safe demo settings.", "action": "Show polygon points → enable check → explain foot-point → 3 frames → cooldown → escalate if unresolved.", "verify": "Use illustrations if no authorized footage is available.", "viva": "What could go wrong? → Incorrect geometry, policy or detector support."}]}, {"id": "architecture", "icon": "layers", "title": "Architecture, Database & APIs", "kicker": "UNDER THE HOOD", "description": "Explain how input, inference, business rules, storage, authentication, evidence and reporting are connected.", "fact": "Project components referenced previously include FastAPI, OpenCV, Ultralytics YOLO, Python tracking and SQLite.", "lessons": [{"title": "End-to-end architecture", "summary": "Camera or uploaded media enters the Python server; OpenCV decodes frames; models predict; rules evaluate; approved events reach SQLite and UI endpoints.", "action": "Trace Input → Inference → Policy → Event → Database → Interface.", "verify": "Keep asynchronous notification work separate from the incident decision.", "viva": "Why use layers? → To isolate processing, rules and presentation."}, {"title": "API and session protection", "summary": "The web frontend communicates with authenticated Python HTTP endpoints. Role checks should be enforced server-side for privileged actions.", "action": "Explain request → authentication → authorization → handler → response.", "verify": "Do not mistake login UI visibility for API security.", "viva": "Why authenticate the endpoint? → To protect media, incidents and settings."}, {"title": "Camera capture services", "summary": "OpenCV capture connects to a selected index or stream URL and converts decoded frames into images for inference.", "action": "Explain start, read, fail/reconnect and stop lifecycle.", "verify": "Invalid stream URLs must not generate fictitious live detections.", "viva": "Why isolate capture? → Different cameras and codecs can fail independently."}, {"title": "Model registry and check mapping", "summary": "A model registry records checkpoints and class mappings; safety-check filtering decides which classes a selected policy may use.", "action": "Trace a MISSING_HELMET check to a compatible model class.", "verify": "A declared catalog option does not create missing trained weights.", "viva": "What prevents fabricated results? → Registered compatibility and actual inference."}, {"title": "Safety rules and temporal logic", "summary": "Hazard rules convert compatible model observations into possible incidents using configured policy, region and persistence conditions.", "action": "Explain how a restricted-zone rule combines tracker, polygon, 3 frames and cooldown.", "verify": "Keep thresholds specific to their originating rule.", "viva": "Why not save every frame? → It would create duplicate unreviewed alarms."}, {"title": "SQLite entity design", "summary": "The previously discussed database includes devices, policies, incidents, evidence, events, supervisors, restricted areas, escalation and outbox records.", "action": "Sketch relationships: Device → Incidents → Evidence/Events; Supervisor ← Assignments.", "verify": "Exact column names require the repository schema; do not invent SQL DDL.", "viva": "Why separate incident events? → Audit history needs multiple actions per record."}, {"title": "Evidence and audit trail", "summary": "A qualifying live event may store time-stamped evidence, while a user action appends an auditable workflow change.", "action": "Explain who performed what action, to which incident and when.", "verify": "Check retention and access control for media containing workers.", "viva": "Why preserve history? → Accountability and later investigation."}, {"title": "Image analysis API", "summary": "The implemented image-lab endpoint is POST /api/images/analyze; it validates uploaded media, runs supported checks and returns annotated sample output.", "action": "Review fields source=UPLOADED_SAMPLE and saved_as_incident=false.", "verify": "Never call returned sample predictions live event records.", "viva": "Does this endpoint alert the factory? → No."}, {"title": "Offline job and sensor APIs", "summary": "Offline video jobs are processed from stored uploads; POST /api/sensors/simulate tests numeric rules and can create TEST records.", "action": "Contrast a media job with a synchronous synthetic reading and its incident IDs.", "verify": "Video owner-scoping, job IDs and queue limits protect processing.", "viva": "How many concurrent video inferences? → One job executes at a time in the cited implementation."}, {"title": "Architecture viva walkthrough", "summary": "Explain the major services and connect each one to a visible user action.", "action": "Demonstrate a sample image analysis, then trace a simulated TEST incident into the database-facing UI.", "verify": "State that deployment, scalability and certification are separate future engineering tasks.", "viva": "Why is it a prototype? → It demonstrates a workflow without validated industrial reliability."}]}, {"id": "lab", "icon": "flask", "title": "AI Test Lab: Image, Video & Sensors", "kicker": "MODULE 08 · PRACTICAL", "description": "A hands-on guide to single-image predictions, offline annotated MP4, synthetic sensor thresholds and viva demonstrations.", "fact": "Image/video lab outputs are unconfirmed and not live incidents; sensor experiments create explicitly labeled TEST incidents.", "lessons": [{"title": "What the Lab tests", "summary": "Image Lab evaluates one sample photograph; Video Lab processes a recording; Sensor Lab applies numeric test thresholds. These are separate experimental workflows.", "action": "Open AI Test Lab and identify its three sections.", "verify": "Image/video use supported YOLO inference, sensor simulation does not.", "viva": "Can this replace factory validation? → No."}, {"title": "Image formats and limits", "summary": "Valid image uploads accept JPEG, PNG or WebP, up to 8 MB and 24 megapixels; wide images are resized to 1280 pixels and inference runs at size 640.", "action": "Choose an authorized PPE photo, check extension and upload size.", "verify": "The backend decodes actual image content; renaming a bad file is insufficient.", "viva": "What output appears? → Annotated JPEG and detection data."}, {"title": "Image prediction workflow", "summary": "Select Camera 1 and a supported check such as MISSING_HELMET, save the camera policy, then click Analyze photo.", "action": "Identify predicted label, bounding box, confidence, chosen checks and potential violations.", "verify": "Missing detections do not prove compliance; no actual score is predetermined.", "viva": "Is confidence a safety guarantee? → No."}, {"title": "Image endpoint and response", "summary": "POST /api/images/analyze validates and decodes, selects compatible models, filters classes and returns a Base64 JPEG with a sample-analysis warning.", "action": "Read the sample-response fields UPLOADED_SAMPLE and saved_as_incident=false.", "verify": "Confirm no central incident or notification is created by this image test.", "viva": "Why no incident? → It is controlled offline inference."}, {"title": "Choose supported checks", "summary": "Camera policy limits the labels that can be reported; only registered compatible model classes should be considered. Experimental face-shield/apron candidate weights are not automatically approved.", "action": "Compare a helmet-only selection with the model class list.", "verify": "Do not claim all catalog checks have working trained detectors.", "viva": "What if no detector is usable? → Show the compatibility problem, not a false prediction."}, {"title": "Video formats and limits", "summary": "The offline lab accepts MP4, MOV, AVI, MKV or WebM, up to 350 MB and 20 minutes, depending on decode support. Standard H.264 MP4 is a practical demo choice.", "action": "Prepare a short authorized clip, check its codec and use the selected camera checks or saved independent checklist.", "verify": "A supported extension does not guarantee decoder compatibility.", "viva": "What gets generated? → Annotated MP4 when the job succeeds."}, {"title": "Video processing job", "summary": "Video upload creates a queued job; OpenCV decodes frames, YOLO predicts supported classes, annotations are drawn and a new MP4 is encoded.", "action": "Track job status queued → processing → completed/failed, frame progress and class counts.", "verify": "Only one offline inference job executes at once; the queue admits up to three active/queued jobs.", "viva": "What does progress mean? → Frames processed, not percent of safety achieved."}, {"title": "Understand video outputs", "summary": "Annotated footage distinguishes PRESENT (green), VIOLATION (red) and REVIEW (amber), with an UNCONFIRMED MODEL DETECTIONS overlay. Successful runs offer preview and download.", "action": "Show the saved MP4 and explain detections across frames.", "verify": "Forty-five missing-helmet detections may come from one repeatedly observed person.", "viva": "Are frame counts unique incidents? → No."}, {"title": "Synthetic smoke and heat", "summary": "An authorized Admin or Safety Officer enters manual values. Smoke >=300 ppm creates SMOKE TEST; temperature >=70°C creates HIGH_TEMPERATURE TEST. These are prototype thresholds, not approved industrial limits.", "action": "Try 100 ppm/30°C (none), 350/35 (SMOKE) and 100/80 (HIGH_TEMPERATURE).", "verify": "Check source=SIMULATION_SENSOR and severity=TEST in Incidents.", "viva": "Is a physical sensor connected? → No."}, {"title": "Security and complete lab viva", "summary": "Lab access is authenticated. Main UI provides Image/Video to Admin, Operator and Safety Officer; synthetic reading and policy change to Admin/Safety Officer. Some upload API role checks need tightening.", "action": "Demonstrate image → optional short video → synthetic below threshold → synthetic above threshold → inspect TEST record.", "verify": "Owner-scoped video files, valid upload bounds, proper retention and backend RBAC must be discussed.", "viva": "What is the central distinction? → Uploaded media tests models; synthetic readings test event recording."}]}]</script>
<script type="application/json" id="notes">"Explain SafetyGuard AI AI Test Lab in complete practical detail, including image upload, video upload and annotated MP4 processing, choosing active AI checks, model predictions, confidence, image/video outputs, simulated smoke/temperature sensors, differences from live incidents, security and complete viva demonstration.\n\nWorked for 1m 54s\nSafetyGuard AI — AI Test Lab, Image/Video Analysis & Sensor Simulation\nModule 8 · Complete practical explanation, model predictions, annotated results, synthetic sensor testing and viva demonstration\n\nThe AI Test Lab is the testing and experimentation section of your SafetyGuard AI project. It allows you to examine how installed YOLO models respond to uploaded images or videos without connecting a live factory camera.\n\nIt also includes a synthetic sensor experiment, where you enter example smoke and temperature readings to demonstrate how threshold-based incidents would work.\n\nI checked the actual implementation in your latest operational release, including app.py, video_analysis.py and the AI Test Lab interface.\n\n1. Why do we need an AI Test Lab?\nImagine that a factory manager wants to test the system before connecting it to CCTV cameras. They have an old photograph showing workers wearing safety equipment and a short recording of a production area.\n\nThey can use the AI Test Lab to find out which configured objects the models detect, whether an annotated output can be generated and whether model compatibility problems occur.\n\nImage Lab\n\nTest one photograph\nVideo Lab\n\nAnalyze recorded footage\nSensor Lab\n\nTest simulated readings\nThese three functions have different outputs.\n\nFunction\n\nUses actual YOLO inference?\n\nCreates an incident?\n\nImage analysis\n\nYes, with supported models\n\nNo\n\nRecorded-video analysis\n\nYes, with supported models\n\nNo\n\nSynthetic sensor experiment\n\nNo, uses simple threshold rules\n\nYes, explicitly marked TEST\n\nThis distinction is essential for your viva.\n\n2. AI Image Lab — analyzing a photograph\nThe first section is called AI image lab · test with factory photos.\n\nIt accepts a photograph and passes it through the configured detection models.\n\nFor example, suppose you upload a photograph of a construction worker wearing a helmet and vest.\n\nThe image detector might report recognized safety equipment, potential violations or no supported detections, depending on the model and selected checks.\n\nSupported image formats\nRequirement\n\nSupported configuration\n\nFile formats\n\nJPG/JPEG, PNG, WebP\n\nMaximum upload size\n\n8 MB\n\nMaximum input resolution\n\n24 megapixels\n\nProcessing width\n\nResized to 1280 pixels if wider\n\nAI inference size\n\n640 pixels\n\nOutput\n\nAnnotated JPEG and detection results\n\nThe server verifies that the file can actually be decoded as an image. Simply renaming an invalid file to .jpg will not make it a valid image.\n\nHow to upload an image practically\nExample experiment — Helmet Detection\n\nCamera policy\tCamera 1\nSelected check\t\nMISSING_HELMET\n\nTest image\tA permitted PPE demonstration photograph\nAction\tAnalyze photo\nExpected output type\tAnnotated image and prediction summary\nFirst open Camera Network → Safety checks, select Camera 1, enable a supported helmet check and save the policy. Then open AI Test Lab, choose your image and click Analyze photo.\n\nThe result area reports the number of selected-check detections, potential violations and the camera policy used.\n\nIt also displays the annotated image when the server successfully encodes it.\n\nWhat does the annotated result look like?\n\nIllustration only. The boxes, labels and confidence scores are hypothetical and are not actual predictions from your system.\nYour actual model determines the labels and confidence scores. The program does not generate these values arbitrarily.\n\nWhat happens inside the Python backend?\nThe API endpoint is:\n\nPOST /api/images/analyze\n\nThe backend validates the image, decodes it using OpenCV, retrieves the selected camera's check policy, runs the relevant YOLO models and filters unsupported or unselected classes.\n\nIt then draws bounding boxes and returns the detections together with a Base64-encoded annotated JPEG.\n\nThe image is stamped with a warning indicating that this is sample analysis, unconfirmed and not recorded as an incident.\n\nDoes uploading an image send a notification?\nNo. The image analysis endpoint explicitly returns:\n\n{\n  \"source\": \"UPLOADED_SAMPLE\",\n  \"saved_as_incident\": false\n}\n\nThe full response also includes the selected checks, detections, potential violation count and annotated image data.\n\nThat means image testing is separate from the live-camera incident system. It is useful for model demonstration without creating artificial factory incidents.\n\n3. Selecting the correct AI checks for image testing\nYour project deliberately uses strict class selection.\n\nThis means the system should display only detections relevant to the chosen camera's saved safety checks.\n\nImagine a YOLO model contains Helmet, Vest, Gloves and Mask classes.\n\nIf your camera policy enables only Helmet detection, the image lab should not suddenly report Gloves or Mask violations.\n\nSelected check\n\nPermitted result\n\nMissing Helmet\n\nCompatible helmet-violation class\n\nMissing Vest\n\nCompatible vest-violation class\n\nFire\n\nCompatible fire/flame class\n\nSmoke\n\nCompatible smoke class\n\nOnly loaded and supported models can provide actual predictions.\n\nFor example, your face_shield_candidate.pt contains the no_faceshield and no_appron dada classes, but these are still unregistered experimental candidates. The regular AI Test Lab does not automatically treat them as approved live detectors.\n\nTo demonstrate those models separately, you can use the already prepared annotated-image outputs from your local YOLO evaluation.\n\nWhy is selection important? It makes the AI testing behavior consistent with camera policy. A detection class that is irrelevant to a monitored zone should not appear as a valid safety violation merely because the model knows the label.\n\n4. Offline Video Lab — processing uploaded recordings\nThe second part is Offline video safety analysis.\n\nThis is different from Live Monitoring.\n\nLive Monitoring processes a currently connected camera. Video Lab processes a recording that already exists as a file.\n\nYour application supports:\n\nVideo requirement\n\nLimit\n\nInput formats\n\nMP4, MOV, AVI, MKV, WebM\n\nMaximum upload\n\n350 MB\n\nMaximum duration\n\n20 minutes\n\nProcessing\n\nServer-side YOLO inference\n\nOutput\n\nAnnotated MP4\n\nHistory\n\nPer-user recent analysis jobs\n\nSome codecs may not be decodable even when the extension is supported. A standard H.264 MP4 is generally the most practical format to test.\n\nHow to analyze a recording\nSuppose you have a 30-second demonstration video.\n\nOpen AI Test Lab → Offline video safety analysis.\n\nBy default, the checkbox Use selected camera checks for uploaded video is enabled. This means the video inherits the saved safety-check policy of the currently selected camera.\n\nYou can also uncheck it and use an independent video checklist.\n\nThe interface provides Copy selected camera checks, Supported only, Select all, Clear all, and Save video checklist controls for users authorized to change policies.\n\nFor a clear demo, choose only a small number of supported checks rather than selecting every catalog item.\n\nAfter saving the selection, choose your recording and click Analyze video & create marked output.\n\nThe system uploads the file to the Python server and creates a background processing job within the running application.\n\nVideo processing pipeline\n1\n\nUpload video\n\nValidate format, file size and selected checklist\n\n2\n\nCreate job\n\nAssign a unique processing ID and store the selected policy snapshot\n\n3\n\nOpen frames\n\nOpenCV decodes the video frames\n\n4\n\nRun YOLO\n\nCompatible models predict selected classes on each frame\n\n5\n\nAnnotate frames\n\nDraw labels, confidence and bounding boxes\n\n6\n\nEncode output\n\nCreate a new MP4; use FFmpeg for H.264 conversion when available\n\n7\n\nDisplay results\n\nShow progress, detection counts, preview and download\n\nThe system also protects the video-processing queue. Your implementation accepts up to three queued or processing jobs, while only one offline inference job executes at a time.\n\nThis prevents multiple large uploads from competing uncontrollably for the same CPU/GPU resources.\n\nWhat do the video progress values mean?\nDuring processing you may see a status such as:\n\nProcessing video\n\nExample\n120 frames processed\n\n50%\n\nIllustrative example; progress is based on decoded frame processing.\nThe job's status can be queued, processing, completed or failed.\n\nThe frontend polls the server for progress approximately every 1.6 seconds while the job is active.\n\nIf processing completes, it shows the available detection counts and offers Download annotated MP4 and Open output video.\n\n5. Understanding annotated MP4 output\nYour video-processing code uses three important visual categories.\n\nGreen — PRESENT\n\nA supported equipment or person class is detected.\n\nRed — VIOLATION\n\nA compatible negative-PPE or hazard class is predicted.\n\nAmber — REVIEW\n\nA possible-smoking observation requires human verification.\n\nThese labels identify the type of model observation, not a confirmed real-world event.\n\nThe video also includes an overlay indicating:\n\nSAFETYGUARD AI | UNCONFIRMED MODEL DETECTIONS\n\nWhat does a video detection count mean?\nSuppose the video results show:\n\nPredicted class\n\nExample count\n\nMissing Helmet\n\n45\n\nMissing Vest\n\n20\n\nWorker Presence\n\n180\n\nThese are illustrative results.\n\nThe counts represent detections across video frames, not 45 different helmet violations or 180 unique employees.\n\nFor example, a single worker appearing without a helmet across 45 frames may account for many of those detections.\n\nThis is an important limitation to explain to your examiner. The offline video pipeline is primarily an annotation and inference tool, not a complete employee-identification or event-counting system.\n\nWhere is the processed video stored?\nThe server creates a job directory under:\n\nD:\\GEC_SafetyGuard_2026\\video_outputs\\\n\nIt stores job metadata and the annotated MP4. The output can be downloaded by the account that uploaded the video.\n\nCompleted analysis history can be reopened after restarting the server, provided the files are still retained.\n\nThe project includes retention-cleanup utilities; do not assume test videos should remain stored indefinitely.\n\n6. Difference between Live Monitoring and AI Test Lab\nCapability\n\nLive Monitoring\n\nAI Test Lab\n\nSource\n\nConnected webcam/IP camera\n\nUploaded photo or recorded video\n\nProcessing\n\nWhile camera runs\n\nOn demand\n\nAI models\n\nEnabled live-policy models\n\nSelected supported models\n\nIncident creation\n\nYes, when event rules are satisfied\n\nNo for image/video analysis\n\nCentral alerts\n\nYes\n\nNo for image/video analysis\n\nTime-stamped evidence\n\nAvailable for qualifying live incidents\n\nSeparate annotated test output\n\nSupervisor workflow\n\nCan follow recorded incidents\n\nNot automatically triggered\n\nPrimary purpose\n\nMonitoring and response\n\nExperimentation and model demonstration\n\nYour previous operational update stamps the camera and capture time on live incident evidence. The offline MP4 pipeline instead marks frames as unconfirmed model detections; it should not be described as the same incident-evidence workflow.\n\nThe key distinction: AI Test Lab can demonstrate real model inference without creating a live-camera safety incident.\n\n7. Simulated Sensor Lab — smoke and temperature\nThe third section is Simulated sensor experiment.\n\nThis is different from YOLO image analysis.\n\nIt does not use a physical smoke sensor, temperature probe, Arduino or IoT device.\n\nInstead, an authorized user manually enters a hypothetical sensor reading. The backend evaluates two simple conditions.\n\nSimulated measurement\n\nThreshold\n\nSynthetic incident\n\nSmoke concentration\n\nAt least 300 ppm\n\nSMOKE\n\nTemperature\n\nAt least 70°C\n\nHIGH_TEMPERATURE\n\nThese are illustrative prototype thresholds, not validated industrial safety or exposure limits.\n\nInteractive example\nTry changing the two simulated values below. This demonstration calculates the same basic threshold conditions, but it does not submit anything to your actual SafetyGuard database.\n\nSynthetic Sensor Experiment\n\nIllustration only\nSmoke concentration\n350 ppm\n0 ppm\nTrigger: 300 ppm\n600 ppm\nTemperature\n35°C\n-40°C\nTrigger: 70°C\n120°C\nResult\n\n1 TEST incident\nSMOKE\n\nPractical examples\nA smoke value of 350 ppm and temperature of 35°C generates one simulated SMOKE incident.\n\nA smoke value of 150 ppm and temperature of 85°C generates one simulated HIGH_TEMPERATURE incident.\n\nA smoke value of 350 ppm and temperature of 85°C generates two separate TEST incidents because both conditions are satisfied.\n\nIf neither threshold is reached, no incident is generated.\n\nHow to run this in your actual project\nOpen AI Test Lab → Simulated sensor experiment as Admin or Safety Officer.\n\nEnter the smoke concentration and temperature values, then click Send synthetic reading.\n\nThe backend endpoint is:\n\nPOST /api/sensors/simulate\n\nWhen a threshold is crossed, the system inserts an incident with:\n\n{\n  \"source\": \"SIMULATION_SENSOR\",\n  \"severity\": \"TEST\",\n  \"type\": \"SMOKE\"\n}\n\nThis example represents one synthetic SMOKE record. A temperature threshold crossing instead uses HIGH_TEMPERATURE.\n\nThe UI reports generated incident IDs. You can then find those incidents in the Overview or Incidents page.\n\nWhy does synthetic sensor testing create an incident when image/video testing does not?\nBecause the sensor experiment is explicitly designed to demonstrate the incident-recording workflow.\n\nImage and video testing demonstrate model inference. Synthetic sensor testing demonstrates how sensor readings could be converted into database events.\n\nBut the source and TEST severity ensure the records are not mistaken for confirmed factory hazards.\n\nYour separate Sensor Concept page also presents hypothetical examples of future sensor integration. It is informational; actual sensor hardware is not connected.\n\n8. Security and access permissions\nYour AI Test Lab requires an authenticated SafetyGuard session.\n\nAction\n\nAdmin\n\nOperator\n\nSafety Officer\n\nSupervisor\n\nUse image testing in main UI\n\n✓\n\n✓\n\n✓\n\nNo main Lab page\n\nUse video testing in main UI\n\n✓\n\n✓\n\n✓\n\nNo main Lab page\n\nChange safety-check policies\n\n✓\n\n—\n\n✓\n\n—\n\nRun synthetic sensor experiment\n\n✓\n\n—\n\n✓\n\n—\n\nView own video processing results\n\n✓\n\n✓\n\n✓\n\nNo main Lab page\n\nAccess another user's uploaded video output\n\n—\n\n—\n\n—\n\n—\n\nVideo job results are checked against the uploading account's identity before they are served.\n\nThere is one important security distinction: the image and video upload endpoints currently require authentication but do not explicitly restrict their roles to Admin, Operator and Safety Officer. The Supervisor UI hides the Lab, but a directly constructed authenticated API request may still reach those upload endpoints.\n\nFor genuine industrial multi-user deployment, that backend role restriction should be tightened. The UI restriction alone is not a sufficient access-control boundary.\n\nUpload security protections\nThe code validates uploaded image types, sizes, dimensions and decoding. Video uploads are restricted by extension, size and runtime duration.\n\nVideo processing uses generated job identifiers rather than arbitrary client-supplied output paths, and access to completed video jobs is owner-scoped.\n\nHowever, uploaded worker images and videos can contain sensitive workplace information. Use authorized materials, restrict server access and apply an appropriate retention policy.\n\n9. Troubleshooting common AI Test Lab problems\nProblem\n\nLikely cause\n\nWhat to do\n\nImage shows no detections\n\nModel cannot recognize objects, confidence threshold or class selection\n\nCheck saved camera policy and model capability\n\nImage says unsupported format\n\nFile is not a JPEG, PNG or WebP\n\nConvert to a supported image format\n\nImage too large\n\nMore than 8 MB or 24 MP\n\nResize or compress\n\nVideo cannot decode\n\nUnsupported codec or malformed media\n\nConvert to a standard H.264 MP4\n\nNo safety checks selected\n\nEmpty video checklist\n\nSelect at least one check\n\nNo usable detector\n\nModel missing or incompatible with selected check\n\nVerify model loading and class mapping\n\nVideo analysis is slow\n\nCPU inference, multiple models or large video\n\nTest a shorter clip with fewer checks\n\nVideo preview fails but download exists\n\nMP4 codec/browser compatibility\n\nOpen the downloaded file locally or configure FFmpeg\n\nNo incident appears after image/video upload\n\nExpected behavior\n\nImage/video tests do not create live incidents\n\nOperator cannot send sensor reading\n\nIntended permission restriction\n\nUse Admin or Safety Officer\n\nSynthetic incident appears in Analytics\n\nExpected behavior\n\nIts source remains SIMULATION_SENSOR\n\nA useful troubleshooting habit is to confirm three things separately: the model loads, the selected check has a compatible class, and the test image/video visibly contains an object the model was trained to recognize.\n\n10. Complete viva demonstration — without a factory camera\nBecause you do not have factory footage, this is a practical way to demonstrate the module using your prepared dataset, a short optional recording and synthetic sensor values.\n\nAI Test Lab Viva Demonstration\n\nMark each step as you perform it in the application.\n0/12\n\n\n1. Open SafetyGuard\n\nStart the Windows application and log in as Admin.\n\n\n2. Set the policy\n\nGo to Camera Network → Safety checks, select Camera 1, and enable one supported PPE check.\n\n\n3. Open AI Test Lab\n\nShow the Image Lab, Offline Video Analysis and Simulated Sensor Experiment sections.\n\n\n4. Upload an image\n\nChoose a suitable authorized test image and click Analyze photo.\n\n\n5. Explain the prediction\n\nShow any bounding box, predicted label and confidence. Explain why a missing detection does not prove compliance.\n\n\n6. Show the video workflow\n\nIf a short permitted MP4 is available, upload it, use the selected camera policy and start analysis. Otherwise explain the flow using the interface.\n\n\n7. Review video output\n\nIf a video job was run, show processed frames, class counts and the annotated MP4 download.\n\n\n8. Test a reading below threshold\n\nEnter smoke 100 ppm and temperature 30°C. Show that no TEST incident is created.\n\n\n9. Trigger simulated smoke\n\nEnter smoke 350 ppm and temperature 35°C. Send the reading and record the generated incident ID.\n\n\n10. Trigger simulated temperature\n\nEnter smoke 100 ppm and temperature 80°C. Send the reading and record its TEST incident ID.\n\n\n11. Verify incidents\n\nOpen Incidents, find the SIMULATION_SENSOR records and show their source and TEST severity.\n\n\n12. Explain the distinction\n\nState that uploaded image/video inference creates annotated results, while synthetic sensor readings demonstrate the incident workflow.\n\nThe most reliable demo for your situation\nYou already have a Face Shield/Apron test dataset on Windows. You can use permitted examples to explain the image analysis concept, while remembering that the unregistered candidate classes will not be automatically enabled in the normal AI Test Lab.\n\nFor a video demonstration, you can use your previously tested generated MP4 if it is still available, but label it as generated footage and never present it as independent factory validation.\n\nThe synthetic sensor workflow is especially reliable for demonstrating the database and response workflow because it does not depend on a webcam or YOLO finding an object.\n\n11. Common viva questions and answers\nQ1. Why is AI Test Lab separate from Live Monitoring?\n\nBecause AI Test Lab is for controlled experimentation with uploaded media, while Live Monitoring handles active camera streams and qualifying safety incidents.\n\nQ2. Does uploading an image create an incident?\n\nNo. The image endpoint explicitly marks its results as unconfirmed sample analysis.\n\nQ3. Can uploaded videos be downloaded after processing?\n\nYes. Successful jobs generate an annotated MP4 that the uploading account can download while the retained output exists.\n\nQ4. Is one video frame detection equal to one worker violation?\n\nNo. The same object may be detected repeatedly across many frames.\n\nQ5. What happens if a video contains a helmet but no violation?\n\nA compatible positive-class model may show the helmet as present. Failure to detect a helmet does not automatically establish a violation.\n\nQ6. Does the Sensor Lab use physical sensors?\n\nNo. It uses manually entered numerical readings and threshold rules.\n\nQ7. Why does the synthetic sensor module create incidents?\n\nTo demonstrate how future sensor integration could connect measured conditions to the existing incident database and notification workflow.\n\nQ8. Can I use the 300 ppm smoke threshold in a real factory?\n\nNot as an approved safety threshold. It is an illustrative value in this prototype and has not been established as a validated industrial limit.\n\nQ9. Are Face Shield and Apron fully operational in the Lab?\n\nThey have a trained checkpoint with holdout evaluation results, but are not registered as approved live detectors. Separate candidate-model inference can be demonstrated.\n\nQ10. Can AI Test Lab replace field validation?\n\nNo. Model performance on selected images or videos does not establish real-world reliability across factory camera positions, lighting, equipment and operating conditions.\n\n12. One-minute viva explanation\n\"Our SafetyGuard AI includes an AI Test Lab for testing and demonstrating detection capabilities independently of live factory cameras.\n\nIn the Image Lab, an authenticated user can upload a JPEG, PNG or WebP photograph. The backend uses OpenCV and configured YOLO models to identify selected classes and return an annotated image with prediction labels and confidence scores.\n\nThe Video Lab accepts recorded footage and processes it frame by frame. It creates a new annotated MP4, displays processing progress and allows the user to download the output. Video detection counts represent observations across frames, not unique workers or confirmed incidents.\n\nWe have also implemented a simulated sensor experiment. Users can enter hypothetical smoke and temperature readings, which are checked against configured demonstration thresholds. When a threshold is exceeded, the system creates an incident explicitly labeled as TEST.\n\nImage and video tests do not create live safety incidents. This separation lets us evaluate the AI models and demonstrate the incident workflow without presenting experimental observations as confirmed factory emergencies.\"\n\n13. What makes AI Test Lab valuable?\nThe Image Lab demonstrates single-frame inference. The Video Lab demonstrates offline frame-by-frame inference and annotated output generation. The Sensor Lab demonstrates threshold-based event creation without physical sensors.\n\nTogether, these allow you to explain three different ways a safety-monitoring platform can process input, while keeping the results clearly separated from validated industrial operations.\n\nRemember this distinction for your examiner: AI Test Lab tests the detection technology; Live Monitoring observes active cameras; Incident Management handles qualifying events; Analytics reports the records created by those events."</script>

const iconPaths={shield:'<path d="M12 2l8 4v6c0 4.8-3.2 7.8-8 10-4.8-2.2-8-5.2-8-10V6z"/><path d="m8 12 3 3 5-6"/>',camera:'<rect x="2" y="5" width="15" height="14" rx="3"/><path d="m17 10 5-3v10l-5-3z"/>',scan:'<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><circle cx="12" cy="12" r="3"/>',alert:'<path d="m12 3 10 18H2L12 3z"/><path d="M12 9v5m0 3h.01"/>',chart:'<path d="M3 3v18h18"/><path d="m7 16 4-4 3 2 5-7"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19 13 2 1-2 4-2-1a8 8 0 0 1-2 1l-.5 2h-5L9 18a8 8 0 0 1-2-1l-2 1-2-4 2-1a8 8 0 0 1 0-2l-2-1 2-4 2 1a8 8 0 0 1 2-1l.5-2h5L15 6a8 8 0 0 1 2 1l2-1 2 4-2 1a8 8 0 0 1 0 2z"/>',layers:'<path d="m12 2 10 5-10 5L2 7zM2 12l10 5 10-5M2 17l10 5 10-5"/>',flask:'<path d="M9 2h6m-5 0v7L3 20a1 1 0 0 0 1 2h16a1 1 0 0 0 1-2L14 9V2"/><path d="M7 16h10"/>',check:'<path d="m4 12 5 5L20 6"/>',book:'<path d="M4 4h7a3 3 0 0 1 3 3v14a3 3 0 0 0-3-3H4zM20 4h-3a3 3 0 0 0-3 3v14a3 3 0 0 1 3-3h3z"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>'};
function svg(name,size=21){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name]||iconPaths.book}</svg>`}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
const storeKey='safetyguard-guide-progress-v1';let done={};try{done=JSON.parse(localStorage.getItem(storeKey)||'{}')||{}}catch(e){}
const all=chapters.flatMap((m,mi)=>m.lessons.map((l,i)=>({m,mi,l,i,key:`${m.id}-${i}`})));
function completed(){return all.filter(x=>done[x.key]).length}function chapterDone(m){return m.lessons.filter((_,i)=>done[m.id+'-'+i]).length}
function save(){try{localStorage.setItem(storeKey,JSON.stringify(done))}catch(e){}}
function route(mi,i){return '#/lesson/'+chapters[mi].id+'/'+i}function idnum(n){return String(n).padStart(2,'0')}
function renderStrip(id){strip.innerHTML=chapters.map((m,i)=>`<a class="${id===m.id?'selected':''}" href="#/module/${m.id}" title="${esc(m.title)}"><span class="stripnum">${idnum(i+1)}</span><span class="stripname">${esc(m.title)}</span></a>`).join('');document.getElementById('global-progress').style.width=(completed()/80*100)+'%'}
function home(){document.title='SafetyGuard AI | 80 Practical Lessons';return `<section class="home-hero"><div><p class="eyebrow">GEC HACKATHON 2026 / LEARNING SYSTEM</p><h1>One project.<br><em>Every module.</em><br>Fully explained.</h1><p class="lead">A complete, hands-on companion to your SafetyGuard AI industrial safety prototype—from camera setup and YOLO checks to incident response, analytics, security and the AI Test Lab.</p><div class="hero-ctas"><a class="btn btn-primary" href="#/module/overview">Explore the curriculum ${svg('arrow',17)}</a><a class="btn btn-outline" href="#/lesson/lab/9">Practice your viva ${svg('arrow',17)}</a></div><div class="stats"><div class="stat"><strong>08</strong><span>Learning modules</span></div><div class="stat"><strong>80</strong><span>Practical lessons</span></div><div class="stat"><strong>${completed()} / 80</strong><span>Lessons completed</span></div></div></div><div><img class="hero-art" src="${images.hero}" alt="Illustrative SafetyGuard AI camera monitoring diagram showing safety checks and human review"/><p class="smallprint">Illustrative artwork · Not a screenshot or actual YOLO prediction.</p></div></section><section><div class="section-head"><div><p class="eyebrow" style="margin-bottom:8px">LEARNING PATH</p><h2>Choose a module. Follow every step.</h2></div><span class="note">08 chapters · 80 lessons · progress saved on this browser</span></div><div class="chaptergrid">${chapters.map((m,i)=>`<a href="#/module/${m.id}" class="chaptercard"><div class="chaptercard-top"><span class="num">MODULE / ${idnum(i+1)}</span><span class="cardicon">${svg(m.icon,19)}</span></div><div><h3>${esc(m.title)}</h3><p>${esc(m.description)}</p><div class="cardbottom"><span>${chapterDone(m)}/10 lessons done</span><span class="arrow">→</span></div></div></a>`).join('')}</div></section><section class="features"><div class="feature"><div class="ficon">${svg('book',24)}</div><h3>Practical, not just theoretical</h3><p>Each lesson provides concrete demonstration steps, verification points and an examiner-ready explanation.</p></div><div class="feature"><div class="ficon">${svg('flask',24)}</div><h3>Interactive sensor experiment</h3><p>Adjust hypothetical smoke and temperature inputs locally. No server connection or real hardware is implied.</p></div><div class="feature"><div class="ficon">${svg('shield',24)}</div><h3>Source-aware explanations</h3><p>Live incidents, offline YOLO test outputs and synthetic TEST incidents remain clearly separated.</p></div></section><section class="callout-dark"><div><p class="eyebrow" style="color:#a5d9f1;margin:0 0 6px">RECOMMENDED NEXT STEP</p><strong>Try the AI Test Lab before your viva.</strong><p>Image analysis, annotated MP4 workflow, sensor thresholds and a 12-step practical checklist.</p></div><a class="btn" href="#/module/lab">Open the Test Lab guide ${svg('arrow',16)}</a></section>`}
function sidebar(activeId,activeLesson){return `<aside class="sidebar" id="sidebar"><div class="sidebar-title">YOUR CURRICULUM · ${completed()}/80 COMPLETE</div><a href="#/" class="sidehome">${svg('book',16)} Guide homepage</a>${chapters.map((m,mi)=>`<a href="#/module/${m.id}" class="side-module ${m.id===activeId?'active':''}"><span class="n">${idnum(mi+1)}</span><span>${esc(m.title)}<br><small style="font-weight:500;color:#88939b">${chapterDone(m)}/10 complete</small></span></a>${m.id===activeId?`<div class="side-lessons">${m.lessons.map((l,i)=>`<a href="${route(mi,i)}" class="${activeLesson===i?'active':''}"><span class="${done[m.id+'-'+i]?'done':''}">${done[m.id+'-'+i]?'✓':idnum(i+1)}</span><span>${esc(l.title)}</span></a>`).join('')}</div>`:''}`).join('')}</aside>`}
function breadcrumbs(m,idx){let mi=chapters.indexOf(m);return `<div class="breadcrumb"><a href="#/">Home</a> / <a href="#/module/${m.id}">Module ${idnum(mi+1)}</a>${idx===null?'':' / Lesson '+idnum(idx+1)}</div>`}
function modPage(m){let mi=chapters.indexOf(m);return `<div class="layout">${sidebar(m.id,null)}<article class="reader">${breadcrumbs(m,null)}<div class="pagehead"><p class="eyebrow">MODULE ${idnum(mi+1)} / ${esc(m.kicker)}</p><h1>${esc(m.title)}</h1><p>${esc(m.description)}</p></div><div class="modulepanel"><div class="panel"><span class="section-label">What you'll learn</span><h3>From concept to viva-ready explanation</h3><p>Ten focused lessons show the workflow, what to demonstrate, what to verify and how to answer an examiner accurately.</p><div class="progress-track"><span style="width:${chapterDone(m)*10}%"></span></div><small class="note">${chapterDone(m)} of 10 lessons completed</small></div><div class="factbox"><small>IMPORTANT PROJECT FACT</small>${esc(m.fact)}</div></div>${m.id==='overview'||m.id==='architecture'||m.id==='incidents'?`<figure class="readerimage"><img src="${images.flow}" alt="Illustrative camera to detection, rule, incident and human-response pipeline"><figcaption>Concept diagram · A detected box alone is not a confirmed industrial event.</figcaption></figure>`:m.id==='lab'?`<figure class="readerimage"><img src="${images.sensor}" alt="Illustrative prototype smoke and heat thresholds"><figcaption>Prototype sensor thresholds, not approved industrial alarm limits.</figcaption></figure>`:''}<p class="section-label">ALL 10 LESSONS</p><div class="module-lessons">${m.lessons.map((l,i)=>`<a href="${route(mi,i)}" class="lesson-link"><div class="lesson-link-top"><span>${idnum(mi+1)}.${idnum(i+1)}</span><span>${done[m.id+'-'+i]?'✓ COMPLETE':'↗ OPEN'}</span></div><h3>${esc(l.title)}</h3><p>${esc(l.summary)}</p></a>`).join('')}</div>${m.id==='lab'?`<div class="callout-dark"><div><strong>Full supplied AI Test Lab reference</strong><p>Original source material with all technical limits, API fields, troubleshooting and complete viva notes.</p></div><a href="#/source" class="btn">Read reference notes</a></div>`:''}</article></div>`}
function lessonPage(m,i){let mi=chapters.indexOf(m),l=m.lessons[i],key=m.id+'-'+i;let curr=mi*10+i;let prev=all[curr-1],next=all[curr+1];let parts=l.action.split(';').map(s=>s.trim()).filter(Boolean);if(parts.length===1){parts=[l.action,'Explain what the result represents using only observed or documented data.','Distinguish confirmed backend behavior from an illustrative example.']}return `<div class="layout">${sidebar(m.id,i)}<article class="reader">${breadcrumbs(m,i)}<div class="pagehead"><p class="eyebrow">MODULE ${idnum(mi+1)} · LESSON ${idnum(i+1)} / 10</p><h1>${esc(l.title)}</h1><p>${esc(l.summary)}</p></div><div class="lessonmeta"><span>${esc(m.title)}</span><span>${completed()} / 80 COMPLETE</span></div><section class="readpane"><span class="section-label">Practical field guide</span><h2>How to explain and demonstrate it</h2><p class="textintro">${esc(l.summary)}</p><h3>Demonstration workflow</h3><ol class="steps">${parts.map((s,n)=>`<li><span class="stepn">${idnum(n+1)}</span><span>${esc(s)}</span></li>`).join('')}</ol><div class="verifybox"><strong>${svg('check',14)} &nbsp; What to verify</strong><p>${esc(l.verify)}</p></div><div class="vivabox"><strong>Viva question &amp; answer</strong><p>${esc(l.viva)}</p></div>${m.id==='lab'&&(i===8)?sensorSim():''}${m.id==='lab'&&(i===9)?vivaChecklist():''}${m.id==='lab'&&(i===6||i===7)?`<figure class="readerimage"><img src="${images.hero}" alt="Illustrative annotated camera/video processing preview"><figcaption>Visual demonstration only · No generated screenshot is a real model prediction.</figcaption></figure>`:''}${(m.id==='overview'&&i===5)||(m.id==='architecture'&&i===0)?`<figure class="readerimage"><img src="${images.flow}" alt="Illustrative event-handling architecture"><figcaption>Conceptual pipeline for presentation and explanation.</figcaption></figure>`:''}${m.id==='lab'?`<p class="smallprint"><a href="#/source" style="color:#0b6d9e;text-decoration:underline">Read the complete original AI Test Lab notes</a> for specifications, detailed troubleshooting and the full viva script.</p>`:''}</section><div class="lessonactions"><button class="btn ${done[key]?'completed-button':'btn-primary'}" data-complete="${esc(key)}">${done[key]?svg('check',16)+' Completed — click to undo':svg('check',16)+' Mark lesson completed'}</button><button class="btn btn-outline" onclick="window.print()">Print this lesson</button></div><nav class="arrowlinks">${prev?`<a href="${route(prev.mi,prev.i)}"><small>← PREVIOUS LESSON</small>${esc(prev.l.title)}</a>`:'<span></span>'}${next?`<a style="text-align:right" href="${route(next.mi,next.i)}"><small>NEXT LESSON →</small>${esc(next.l.title)}</a>`:'<span></span>'}</nav></article></div>`}
function sensorSim(){return `<section class="sensorlab" aria-label="Interactive simulated sensor experiment"><div class="labtop"><div><small>INTERACTIVE · LOCAL DEMONSTRATION</small><h3>Synthetic sensor experiment</h3></div><span class="chip">NO BACKEND CALL</span></div><div class="sensorgrid"><div class="sens"><label for="smoke">Smoke concentration <output id="smokeval">350 ppm</output></label><input id="smoke" type="range" min="0" max="600" value="350" step="10"><small>TEST threshold: at least 300 ppm</small></div><div class="sens"><label for="temp">Temperature <output id="tempval">35°C</output></label><input id="temp" type="range" min="-40" max="120" value="35" step="1"><small>TEST threshold: at least 70°C</small></div></div><div class="sensorout" id="sensorout"></div><p class="sensor-note">Illustration only. Slider changes do not contact your SafetyGuard server or create database records. In the installed prototype an authorized user sends a reading through POST /api/sensors/simulate.</p></section>`}
const vivaSteps=['Sign in as Admin and open the operational dashboard','Choose Camera 1 and save one supported safety check','Open AI Test Lab and identify its three sections','Upload an authorized JPEG/PNG/WebP image','Explain actual class, confidence and bounding box—or why none appeared','Show the recorded-video upload workflow','If a video is processed, inspect counts and open/download the annotated MP4','Enter 100 ppm smoke and 30°C; explain no TEST event','Enter 350 ppm and 35°C; expect a SMOKE TEST event in the actual app','Enter 100 ppm and 80°C; expect a HIGH_TEMPERATURE TEST event','Locate SIMULATION_SENSOR / TEST records in Incident Management','Conclude with the distinction between live monitoring, offline inference and simulation'];
function vivaChecklist(){return `<div style="margin-top:29px"><h3>12-step AI Test Lab viva checklist</h3><p class="note">Use this during your presentation. Completion is stored only in this browser.</p><div class="checklist">${vivaSteps.map((s,i)=>`<label class="checkrow"><input type="checkbox" data-viva="${i}" ${done['viva-'+i]?'checked':''}><span><strong>${idnum(i+1)}. ${esc(s)}</strong>${i===5?'<span>Use an existing permitted clip; do not invent video evidence.</span>':''}</span></label>`).join('')}</div></div>`}
function sourcePage(){return `<div class="layout">${sidebar('lab',null)}<article class="reader"><div class="breadcrumb"><a href="#/">Home</a> / <a href="#/module/lab">AI Test Lab</a> / Full reference</div><div class="pagehead"><p class="eyebrow">ORIGINAL UPLOADED STUDY NOTES</p><h1>AI Test Lab · Complete reference notes</h1><p>The complete provided text is preserved below, including the original explanation, limits, practical examples, permissions, troubleshooting and viva instructions.</p></div><div class="callout-dark" style="margin:0 0 22px"><div><strong>Prefer reading in your editor?</strong><p>Open the included AI-Test-Lab-full-source-notes.txt file in the website package.</p></div><a href="AI-Test-Lab-full-source-notes.txt" class="btn" download>Download original notes</a></div><p class="source-note">Source text is reproduced for study. Any examples and model scores remain illustrative unless the original explicitly identifies a real result.</p><div class="sourcewrap">${esc(notes)}</div></article></div>`}
function render(){let parts=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean),type=parts[0]||'home',m=chapters.find(x=>x.id===parts[1]),lessonIndex=Number(parts[2]);let id=m?m.id:null;renderStrip(id);if(type==='module'&&m)app.innerHTML=modPage(m);else if(type==='lesson'&&m&&Number.isInteger(lessonIndex)&&lessonIndex>=0&&lessonIndex<10){app.innerHTML=lessonPage(m,lessonIndex);document.title=`${m.lessons[lessonIndex].title} | SafetyGuard AI`;if(m.id==='lab'&&lessonIndex===8)updateSensor();}else if(type==='source'){app.innerHTML=sourcePage();document.title='AI Test Lab Complete Notes | SafetyGuard AI'}else{app.innerHTML=home();document.title='SafetyGuard AI | 80 Practical Lessons'}if(type!=='lesson'){document.title=(type==='module'&&m?m.title+' | SafetyGuard AI':document.title)}window.scrollTo({top:0,behavior:'instant'});const side=document.getElementById('sidebar');if(side&&window.innerWidth<841)side.classList.remove('open');}
function updateSensor(){const s=document.getElementById('smoke'),t=document.getElementById('temp');if(!s||!t)return;const a=Number(s.value),b=Number(t.value),hits=[];if(a>=300)hits.push('SMOKE');if(b>=70)hits.push('HIGH_TEMPERATURE');document.getElementById('smokeval').textContent=a+' ppm';document.getElementById('tempval').textContent=b+'°C';document.getElementById('sensorout').innerHTML=hits.length?`<strong>${hits.length} hypothetical TEST incident${hits.length>1?'s':''}</strong> ${hits.map(x=>`<span class="testtag">${x}</span>`).join('')}`:'<strong>0 hypothetical TEST incidents</strong> · No threshold reached';}
search.addEventListener('input',()=>{let q=search.value.toLowerCase().trim();if(q.length<2){results.classList.add('hidden');return}let found=all.filter(x=>(x.l.title+' '+x.l.summary+' '+x.m.title).toLowerCase().includes(q)).slice(0,18);results.innerHTML=found.length?found.map(x=>`<a href="${route(x.mi,x.i)}"><small>MODULE ${idnum(x.mi+1)} · LESSON ${idnum(x.i+1)}</small><strong>${esc(x.l.title)}</strong></a>`).join(''):'<div class="empty">No matching lessons. Try “camera”, “threshold”, or “incident”.</div>';results.classList.remove('hidden')});
document.addEventListener('click',e=>{let a=e.target.closest('a');if(a&&a.getAttribute('href')?.startsWith('#/')){results.classList.add('hidden');search.value=''}const completion=e.target.closest('[data-complete]');if(completion){let key=completion.dataset.complete;done[key]=!done[key];save();render();return}if(!e.target.closest('.search-box'))results.classList.add('hidden')});document.addEventListener('input',e=>{if(e.target.id==='smoke'||e.target.id==='temp')updateSensor()});document.addEventListener('change',e=>{if(e.target.matches('[data-viva]')){done['viva-'+e.target.dataset.viva]=e.target.checked;save()}});document.getElementById('mobilemenu').addEventListener('click',()=>{if(!document.getElementById('sidebar')){location.hash='#/module/overview';return}document.getElementById('sidebar').classList.toggle('open')});window.addEventListener('hashchange',render);render();
})();
</script>
